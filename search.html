<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>Search — DealPilot Europe</title>
  <meta name="description" content="Search the DealPilot demo catalogue and filter by country, brand, retailer, price and delivery." />
  <link rel="canonical" href="/search.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="chrome-top"></div>
  <div class="wrap page-hero">
    <div class="crumb"><a href="index.html">Home</a> / <span data-t="searchCrumb">Search</span></div>
    <h1 id="title" style="font-family:var(--serif);font-size:clamp(28px,3vw,40px);color:var(--navy)"></h1>
    <form class="search-box" action="search.html" style="max-width:760px;margin:18px 0;box-shadow:var(--shadow)">
      <input name="q" id="q" data-t-placeholder="searchPlaceholder" placeholder="Search a product or describe what you need..." />
      <button class="btn btn-gold" type="submit" data-t="comparePrices">Compare Prices</button>
    </form>
    <div class="steps" id="steps"></div>
    <button class="btn btn-ghost filters-toggle" id="filters-toggle" type="button" data-t="filters">Filters</button>
    <div class="filters-panel" id="filters-panel"></div>
    <div class="mute" id="count" style="margin-bottom:12px"></div>
    <div id="query-chips"></div>
    <div id="results"></div>
    <div class="pager" id="pager"></div>
    <div id="related"></div>
  </div>
  <div id="chrome-bottom"></div>
  <script type="module" src="/js/search.js"></script>
</body>
</html>
