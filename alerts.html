<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Price alerts — DealPilot Europe</title>
  <meta name="description" content="Manage your local price alerts. Email delivery requires an email provider." />
  <link rel="canonical" href="/alerts.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="chrome-top"></div>
  <div class="wrap page-hero">
    <div class="crumb"><a href="index.html">Home</a> / <span data-t="accountTitle">Price alerts</span></div>
    <h1 style="font-family:var(--serif);font-size:clamp(28px,3vw,40px);color:var(--navy)" data-t="accountTitle">Price alerts</h1>
    <p class="tagline" style="margin:8px 0 18px" data-t="noEmail">Email notifications require an email provider. Alerts stay local until then.</p>
    <div class="tabs" id="tabs">
      <button class="tab on" data-s="active" data-t="active">Active</button>
      <button class="tab" data-s="triggered" data-t="triggered">Triggered</button>
      <button class="tab" data-s="paused" data-t="paused">Paused</button>
    </div>
    <div id="list"></div>
  </div>
  <div id="chrome-bottom"></div>
  <script type="module" src="/js/alerts.js"></script>
</body>
</html>
